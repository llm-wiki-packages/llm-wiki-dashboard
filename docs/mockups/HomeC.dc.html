<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home alternate C: the orbit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0D0D0C;font-family:'Space Grotesk',system-ui,sans-serif;color:#F2F1EA}
a{color:#F2F1EA;text-decoration:none}a:hover{color:#FFFFFF}
@keyframes pulse{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
.live{animation:pulse 1.6s ease-in-out infinite}
.orbit{transform-origin:720px 470px;animation:spin 90s linear infinite}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; background: #0D0D0C; overflow: hidden">

  <div style="position: absolute; left: 40px; top: 36px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 26px; font-weight: 500">Everything, in orbit</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8B8980">this machine at the center · wikis on the inner ring · sources on the outer</div>
  </div>

  <div style="position: absolute; right: 40px; top: 36px; display: flex; gap: 32px; text-align: right">
    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; line-height: 1">148</span><span style="font-size: 11px; color: #8B8980">pages today</span></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 34px; line-height: 1">312</span><span style="font-size: 11px; color: #8B8980">distilled this week</span></div>
  </div>

  <svg viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Radial map: this machine at the center, three wikis on an inner ring, sources on an outer ring" style="position: absolute; left: 0; top: 0">
    <circle cx="720" cy="470" r="170" fill="none" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="720" cy="470" r="340" fill="none" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 6"/>

    <g stroke-width="1.5" fill="none">
      <line x1="720" y1="470" x2="720" y2="300" stroke="rgba(57,135,229,0.6)"/>
      <line x1="720" y1="470" x2="573" y2="555" stroke="rgba(255,255,255,0.18)"/>
      <line x1="720" y1="470" x2="867" y2="555" stroke="rgba(208,59,59,0.5)"/>
    </g>

    <g fill="none" stroke-width="1.5">
      <path d="M720 300 L640 150" stroke="rgba(57,135,229,0.55)"/>
      <path d="M720 300 L800 150" stroke="rgba(57,135,229,0.30)"/>
      <path d="M720 300 L905 195" stroke="rgba(217,89,38,0.45)"/>
      <path d="M720 300 L535 195" stroke="rgba(25,158,112,0.55)"/>
      <path d="M720 300 L1030 330" stroke="rgba(213,81,129,0.35)" stroke-dasharray="3 5"/>
      <path d="M573 555 L410 470" stroke="rgba(201,133,0,0.35)"/>
      <path d="M573 555 L440 660" stroke="rgba(255,255,255,0.14)"/>
      <path d="M867 555 L1030 610" stroke="rgba(255,255,255,0.14)"/>
      <path d="M867 555 L1000 760" stroke="rgba(255,255,255,0.14)"/>
    </g>

    <g fill="#3987e5">
      <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M640 150 L720 300 L720 470"/></circle>
      <circle r="3"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M640 150 L720 300 L720 470"/></circle>
    </g>
    <g fill="#199e70">
      <circle r="3"><animateMotion dur="2.8s" repeatCount="indefinite" path="M535 195 L720 300"/></circle>
    </g>

    <g font-family="'IBM Plex Mono', monospace" font-size="12" fill="#A9A79C" text-anchor="middle">
      <circle cx="640" cy="150" r="14" fill="#141412" stroke="#3987e5" stroke-width="2"/><text x="640" y="126">gmail · clients</text>
      <circle cx="800" cy="150" r="14" fill="#141412" stroke="#3987e5" stroke-width="2"/><text x="800" y="126">gmail · founders</text>
      <circle cx="905" cy="195" r="14" fill="#141412" stroke="#fab219" stroke-width="2"/><text x="960" y="180">notion · parked</text>
      <circle cx="535" cy="195" r="14" fill="#141412" stroke="#199e70" stroke-width="2"/><text x="480" y="180">youtube</text>
      <circle cx="1030" cy="330" r="14" fill="#141412" stroke="#d55181" stroke-width="2" stroke-dasharray="3 3"/><text x="1085" y="335">hubspot · blocked</text>
      <circle cx="410" cy="470" r="14" fill="#141412" stroke="#c98500" stroke-width="2"/><text x="355" y="475">rss</text>
      <circle cx="440" cy="660" r="14" fill="#141412" stroke="#8B8980" stroke-width="2"/><text x="385" y="690">calendar</text>
      <circle cx="1030" cy="610" r="14" fill="#141412" stroke="#9085e9" stroke-width="2"/><text x="1090" y="615">arxiv feed</text>
      <circle cx="1000" cy="760" r="14" fill="#141412" stroke="#8B8980" stroke-width="2"/><text x="1000" y="795">dropped files</text>
    </g>

    <g text-anchor="middle">
      <circle cx="720" cy="300" r="46" fill="#1B1B18" stroke="#3987e5" stroke-width="1.5"/>
      <circle cx="720" cy="300" r="54" fill="none" stroke="#3987e5" stroke-width="1" opacity="0.4" class="live"/>
      <text x="720" y="297" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#F2F1EA">acme-sales</text>
      <text x="720" y="315" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A9A79C">3,880 · 2 live</text>

      <circle cx="573" cy="555" r="40" fill="#1B1B18" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <text x="573" y="553" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#F2F1EA">life</text>
      <text x="573" y="571" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A9A79C">1,204</text>

      <circle cx="867" cy="555" r="36" fill="#1B1B18" stroke="#d03b3b" stroke-width="1.5"/>
      <text x="867" y="553" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#F2F1EA">research</text>
      <text x="867" y="571" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#ec835a">search down</text>

      <circle cx="720" cy="470" r="30" fill="#F2F1EA"/>
      <text x="720" y="467" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#121210">jmac23-3</text>
      <text x="720" y="480" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5E5D59">local</text>
    </g>

    <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8B8980">
      <circle cx="720" cy="640" r="6" fill="#0D0D0C" stroke="#8B8980" stroke-width="1.5"/><text x="720" y="664" text-anchor="middle">studio-mini</text>
      <circle cx="880" cy="380" r="6" fill="#0D0D0C" stroke="#fab219" stroke-width="1.5"/><text x="925" y="384">hetzner-01 · stale</text>
      <line x1="720" y1="470" x2="720" y2="640" stroke="rgba(255,255,255,0.10)" stroke-dasharray="2 4"/>
      <line x1="867" y1="555" x2="880" y2="380" stroke="rgba(250,178,25,0.25)" stroke-dasharray="2 4"/>
    </g>
  </svg>

  <div style="position: absolute; left: 40px; bottom: 36px; display: flex; gap: 20px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8B8980">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F2F1EA; display: inline-block"></span>this machine</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #8B8980; display: inline-block"></span>peer machine</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 2px; background: #3987e5; display: inline-block"></span>live pull</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 0; border-top: 2px dashed #d55181; display: inline-block"></span>blocked</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
