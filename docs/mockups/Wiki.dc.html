<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const W = 1376;
    const px = (h) => Math.round((h / 24) * W);
    const bar = (h, mins, label, kind, track) => {
      const left = px(h);
      const width = Math.max(6, Math.round((mins / 60 / 24) * W));
      const top = track === 0 ? 40 : 76;
      let bg = 'rgba(242,241,234,0.45)';
      let color = '#121210';
      let extra = '';
      if (kind === 'failed') { bg = '#d03b3b'; color = '#F2F1EA'; }
      if (kind === 'running') { bg = '#3987e5'; color = '#F2F1EA'; extra = 'animation: pulse 1.6s ease-in-out infinite;'; }
      if (kind === 'running-aqua') { bg = '#199e70'; color = '#F2F1EA'; extra = 'animation: pulse 1.6s ease-in-out infinite;'; }
      const show = width >= 36 ? label : '';
      const style = `position:absolute;left:${left}px;top:${top}px;width:${width}px;height:26px;border-radius:4px;background:${bg};color:${color};font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:26px;padding:0 6px;box-sizing:border-box;white-space:nowrap;overflow:hidden;${extra}`;
      return { style, label: show };
    };
    const lanesA = [];
    for (let h = 0; h < 24; h++) lanesA.push(bar(h + 0.05, 4, 'hourly', 'ok', 0));
    lanesA.push(bar(1.5, 38, 'nightly · dream', 'ok', 1));
    lanesA.push(bar(3.0, 12, 'nightly-index', 'ok', 1));
    lanesA.push(bar(5.0, 9, 'maintenance', 'ok', 1));
    lanesA.push(bar(8.1, 21, 'improve · rc 1', 'failed', 1));
    lanesA.push(bar(10.0, 6, 'morning', 'ok', 1));
    lanesA.push(bar(11.0, 3, 'denials', 'ok', 1));
    lanesA.push(bar(12.0, 5, 'wiki-report', 'ok', 1));
    lanesA.push(bar(23.3, 42, 'gmail · enrich', 'running', 1));
    const lanesB = [];
    for (let h = 0; h < 24; h++) lanesB.push(bar(h + 0.1, h === 14 ? 40 : 3, h === 14 ? 'hourly-host · 40s outlier' : 'hourly-host', 'ok', 0));
    lanesB.push(bar(22.9, 66, 'youtube · transcribe', 'running-aqua', 1));
    const ticks = ['21:00', '00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', 'now'].map((label, i) => ({
      label,
      style: `position:absolute;left:${px(i * 3)}px;top:0;${i === 8 ? 'transform:translateX(-100%);color:#F2F1EA;' : ''}`,
    }));
    return { lanesA, lanesB, ticks };
  }
}
</script>
